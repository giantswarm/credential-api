{{- if .Values.gatewayAPI.enabled }}
{{- if not .Values.gatewayAPI.parentRefs }}
{{- fail "gatewayAPI.parentRefs is required" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: credential-api
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs: {{ .Values.gatewayAPI.parentRefs | toYaml | nindent 4 }}
  hostnames: [{{ (urlParse .Values.credentialOrigin).host | quote }}]
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: credential-api
      port: 8080
{{- if .Values.portalOrigin }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: credential-api-portal
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs: {{ .Values.gatewayAPI.parentRefs | toYaml | nindent 4 }}
  hostnames: [{{ (urlParse .Values.portalOrigin).host | quote }}]
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /credential-api
    - path:
        type: PathPrefix
        value: /credentials
    backendRefs:
    - name: credential-api
      port: 8080
{{- end }}
{{- end }}
