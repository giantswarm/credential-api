{{- if .Values.ingress.enabled }}
{{- $credentialHost := (urlParse .Values.credentialOrigin).host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credential-api
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts: [{{ $credentialHost | quote }}]
    secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
  - host: {{ $credentialHost | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: credential-api
            port:
              name: http
{{- if .Values.portalOrigin }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credential-api-portal
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts: [{{ (urlParse .Values.portalOrigin).host | quote }}]
    secretName: {{ .Values.ingress.portalTlsSecretName }}
  rules:
  - host: {{ (urlParse .Values.portalOrigin).host | quote }}
    http:
      paths:
      - path: /credential-api
        pathType: Prefix
        backend:
          service:
            name: credential-api
            port:
              name: http
      - path: /credentials
        pathType: Prefix
        backend:
          service:
            name: credential-api
            port:
              name: http
{{- end }}
{{- end }}
